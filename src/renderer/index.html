<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self' data:"
    />
    <title>Token Thrift</title>
    <style>
      @keyframes tt-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes tt-pulse {
        0%,
        80%,
        100% {
          opacity: 0.3;
        }
        40% {
          opacity: 1;
        }
      }

      :root {
        --tt-bg: #15151d;
        --tt-panel: #1c1c26;
        --tt-border: #333;
        --tt-border-light: #3a3a4a;
        --tt-accent: #4d8ec7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--tt-bg);
        color: #eee;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }

      button {
        background: #2a2a38;
        border: 1px solid var(--tt-border-light);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }
      button:hover:not(:disabled) {
        background: #34344a;
        border-color: #52526a;
      }
      button:active:not(:disabled) {
        background: #23232e;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      input:not([type='checkbox']):not([type='radio']),
      select,
      textarea {
        background: var(--tt-panel);
        border: 1px solid var(--tt-border-light);
        border-radius: 6px;
        padding: 6px 8px;
        outline: none;
        transition: border-color 0.15s ease;
      }
      input:not([type='checkbox']):not([type='radio']):focus,
      select:focus,
      textarea:focus {
        border-color: var(--tt-accent);
      }
      input[type='checkbox'],
      input[type='radio'] {
        accent-color: var(--tt-accent);
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--tt-border-light);
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52526a;
      }

      .tt-resizer {
        background: transparent;
        transition: background-color 0.1s ease;
      }
      .tt-resizer:hover {
        background: var(--tt-accent);
        opacity: 0.5;
      }

      /* Chat messages render through react-markdown (see ChatPane.tsx) instead of as plain
         text — a response with a table, headers, or a code block previously showed up as
         literal "| a | b |" / "###" / "```" characters. These rules scope plain HTML tags
         (react-markdown emits semantic elements with no classes of its own) to just the
         message bubbles, and reset their default browser margins for a tight bubble. */
      .tt-markdown {
        line-height: 1.5;
      }
      .tt-markdown > *:first-child {
        margin-top: 0;
      }
      .tt-markdown > *:last-child {
        margin-bottom: 0;
      }
      .tt-markdown p {
        margin: 0 0 8px;
      }
      .tt-markdown h1,
      .tt-markdown h2,
      .tt-markdown h3,
      .tt-markdown h4 {
        margin: 12px 0 6px;
        font-size: 1.05em;
        font-weight: 600;
      }
      .tt-markdown ul,
      .tt-markdown ol {
        margin: 0 0 8px;
        padding-left: 20px;
      }
      .tt-markdown li {
        margin: 2px 0;
      }
      .tt-markdown code {
        background: rgba(255, 255, 255, 0.1);
        padding: 1px 5px;
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 0.9em;
      }
      .tt-markdown pre {
        background: rgba(0, 0, 0, 0.35);
        padding: 10px 12px;
        border-radius: 6px;
        overflow-x: auto;
        margin: 0 0 8px;
      }
      .tt-markdown pre code {
        background: none;
        padding: 0;
      }
      .tt-markdown table {
        border-collapse: collapse;
        display: block;
        overflow-x: auto;
        max-width: 100%;
        margin: 0 0 8px;
      }
      .tt-markdown th,
      .tt-markdown td {
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 4px 8px;
        text-align: left;
      }
      .tt-markdown th {
        background: rgba(255, 255, 255, 0.06);
      }
      .tt-markdown blockquote {
        margin: 0 0 8px;
        padding-left: 10px;
        border-left: 3px solid rgba(255, 255, 255, 0.25);
        opacity: 0.85;
      }
      .tt-markdown hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        margin: 10px 0;
      }
      .tt-markdown a {
        color: var(--tt-accent);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
